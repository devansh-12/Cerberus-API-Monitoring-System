# ── Redis Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus-redis
  namespace: cerberus
  labels:
    app: cerberus-redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cerberus-redis
  template:
    metadata:
      labels:
        app: cerberus-redis
        component: cache
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""       # Disable RDB persistence — cache is ephemeral by design
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
# ── Redis Service (ClusterIP — internal only) ───────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: cerberus-redis
  namespace: cerberus
  labels:
    app: cerberus-redis
    component: cache
spec:
  selector:
    app: cerberus-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP   # Not exposed externally — only reachable within the cluster
