# ── TimescaleDB Init SQL ConfigMap ───────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: cerberus
  labels:
    app: cerberus-postgres
data:
  init-postgres.sql: |
    -- Create TimescaleDB extension
    CREATE EXTENSION IF NOT EXISTS timescaledb;

    -- API Metrics hypertable
    CREATE TABLE IF NOT EXISTS api_metrics (
      time        TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      client_id   TEXT        NOT NULL,
      endpoint    TEXT        NOT NULL,
      method      TEXT        NOT NULL,
      status_code INTEGER     NOT NULL,
      latency_ms  DOUBLE PRECISION,
      ip_address  TEXT
    );
    SELECT create_hypertable('api_metrics', 'time', if_not_exists => TRUE);

    -- Continuous aggregate: 1-minute rollup
    CREATE MATERIALIZED VIEW IF NOT EXISTS api_metrics_1min
    WITH (timescaledb.continuous) AS
      SELECT
        time_bucket('1 minute', time) AS bucket,
        client_id,
        endpoint,
        COUNT(*)                      AS total_hits,
        AVG(latency_ms)               AS avg_latency_ms,
        MAX(latency_ms)               AS max_latency_ms,
        COUNT(*) FILTER (WHERE status_code >= 400) AS error_count
      FROM api_metrics
      GROUP BY bucket, client_id, endpoint
    WITH NO DATA;

---
# ── PersistentVolumeClaim ─────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: cerberus
  labels:
    app: cerberus-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# ── StatefulSet ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cerberus-postgres
  namespace: cerberus
  labels:
    app: cerberus-postgres
    component: database
spec:
  serviceName: cerberus-postgres
  replicas: 1
  selector:
    matchLabels:
      app: cerberus-postgres
  template:
    metadata:
      labels:
        app: cerberus-postgres
        component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        runAsNonRoot: false          # postgres image requires root for init
      containers:
        - name: postgres
          image: timescale/timescaledb:latest-pg15
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: api_monitoring
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cerberus-api-secret
                  key: PG_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF-8"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "api_monitoring"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "api_monitoring"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql

---
# ── ClusterIP Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: cerberus-postgres
  namespace: cerberus
  labels:
    app: cerberus-postgres
    component: database
spec:
  selector:
    app: cerberus-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
