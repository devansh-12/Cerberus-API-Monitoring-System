apiVersion: v1
kind: ConfigMap
metadata:
  name: cerberus-api-config
  namespace: cerberus
  labels:
    app: cerberus-api
data:
  NODE_ENV: "production"
  PORT: "5000"
  # MongoDB
  MONGO_URI: "mongodb://cerberus-mongo:27017/api_monitoring"
  MONGO_DB_NAME: "api_monitoring"
  # PostgreSQL
  PG_HOST: "cerberus-postgres"
  PG_PORT: "5432"
  PG_DATABASE: "api_monitoring"
  PG_USER: "postgres"
  # RabbitMQ
  RABBITMQ_QUEUE: "api_hits"
  # Redis
  REDIS_URL: "redis://cerberus-redis:6379"
  REDIS_CACHE_TTL_VALID: "300"
  REDIS_CACHE_TTL_INVALID: "60"
  # JWT
  JWT_EXPIRES_IN: "24h"
  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
