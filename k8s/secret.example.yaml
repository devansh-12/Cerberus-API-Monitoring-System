apiVersion: v1
kind: Secret
metadata:
  name: cerberus-api-secret
  namespace: cerberus
  labels:
    app: cerberus-api
type: Opaque
stringData:
  # ─────────────────────────────────────────────────────────────────────────────
  # REPLACE all placeholder values before applying to your cluster.
  # Generate secrets with:
  #   openssl rand -base64 32   → for PG_PASSWORD and JWT_SECRET
  #   echo -n "user:pass" | base64  → for RABBITMQ credentials
  # ─────────────────────────────────────────────────────────────────────────────
  PG_PASSWORD: "REPLACE_ME_strong_postgres_password"
  RABBITMQ_DEFAULT_USER: "api_user"
  RABBITMQ_DEFAULT_PASS: "REPLACE_ME_strong_rabbitmq_password"
  RABBITMQ_URL: "amqp://api_user:REPLACE_ME_strong_rabbitmq_password@cerberus-rabbitmq:5672/api_monitoring"
  JWT_SECRET: "REPLACE_ME_minimum_32_character_jwt_secret_key"
