name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code (ESLint)
        run: npm run lint --if-present

      - name: Run tests (Jest/Vitest)
        run: npm test -- --runInBand --detectOpenHandles --verbose

      - name: Build client (Vite) if present
        run: |
          if [ -f client/package.json ]; then
            cd client && npm ci && npm run build
          fi

      - name: Upload test coverage (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**
      
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Install SonarScanner (if not already in your devDependencies)
          npm install -g sonar-scanner
    sonar-scanner \
      -Dsonar.projectKey=your-org_cerberus-api-monitoring-system \
      -Dsonar.organization=your-org \
      -Dsonar.host.url=$SONAR_HOST_URL \
      -Dsonar.login=$SONAR_TOKEN
  # Optional deployment job could be added here

