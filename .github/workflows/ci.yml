name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint server code (ESLint)
        working-directory: server
        run: npm run lint --if-present || echo "No lint script found"

      - name: Run server tests (Jest)
        working-directory: server
        env:
          REDIS_URL: "redis://localhost:6379"
          REDIS_CACHE_TTL_VALID: "300"
          REDIS_CACHE_TTL_INVALID: "60"
          MONGO_URI: "mongodb://localhost:27017/test"
          MONGO_DB_NAME: "test"
          PG_HOST: "localhost"
          PG_DATABASE: "test"
          PG_USER: "test"
          PG_PASSWORD: "test"
          JWT_SECRET: "test-secret-of-at-least-32-characters-ok"
          RABBITMQ_URL: "amqp://localhost"
        run: npm test

      - name: Lint client code (ESLint)
        working-directory: client
        run: npm run lint --if-present || echo "No lint script found"

      - name: Run client tests (Vitest)
        working-directory: client
        run: npm test -- --run

      - name: Build client (Vite)
        working-directory: client
        run: npm run build

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            server/coverage/**
            client/coverage/**

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_TOKEN}" ] || [ -z "${SONAR_HOST_URL}" ]; then
            echo "⚠️  SONAR_TOKEN or SONAR_HOST_URL not set — skipping SonarCloud scan"
            exit 0
          fi
          npm install -g sonar-scanner
          sonar-scanner \
            -Dsonar.projectKey=your-org_cerberus-api-monitoring-system \
            -Dsonar.organization=your-org \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.login="${SONAR_TOKEN}"
